apiVersion: v1
kind: Pod
metadata:
  name: task11a-probe
  namespace: cairn-egress
  labels:
    app.kubernetes.io/name: cairn-egress-gateway
    cairn.example.invalid/posture-owner: task11a
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: cairn:v0.7.0-rc.4
      command: [sleep, infinity]
      readinessProbe:
        exec:
          command: ["false"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Pod
metadata:
  name: task11a-control
  namespace: REPLACE_TASK11A_NAMESPACE
  labels:
    cairn.example.invalid/posture-owner: task11a
    cairn.example.invalid/posture-role: positive-control
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: cairn:v0.7.0-rc.4
      command: [sleep, infinity]
      volumeMounts:
        - name: token
          mountPath: /var/run/secrets/task11a
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
  volumes:
    - name: token
      secret:
        secretName: task11a-client
        defaultMode: 288
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task11a-control-to-cairn
  namespace: REPLACE_TASK11A_NAMESPACE
  labels:
    cairn.example.invalid/posture-owner: task11a
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cairn
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cairn.example.invalid/posture-role: positive-control
      ports:
        - protocol: TCP
          port: 8000

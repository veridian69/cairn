apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cairn
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 10Gi
        storageClassName: cairn-local
        volumeMode: Filesystem

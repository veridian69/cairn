# The base's configuration document with the retrieval index enabled, and
# nothing else changed. The whole document is restated because kustomize
# cannot reach inside a YAML string; the render test compares this
# document against the base's and refuses any difference outside the
# `graphiti` block, so the copy cannot quietly become a different
# configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cairn-config
data:
  config.yaml: |
    schema_version: cairn.config/v1
    # REPLACE PER INSTANCE, and deliberately not a valid UUID so that
    # forgetting to is a refusal rather than a diff a reviewer might miss.
    # A well-formed placeholder loads silently, and two instances sharing
    # an identity would accept each other's backup bundles — the I-41
    # guard compares exactly this value, so a shared one disarms it. This
    # fails configuration loading at startup, naming the field.
    instance_id: REPLACE_WITH_PER_INSTANCE_UUID
    mode: production
    http:
      # In-cluster only: the Service is the boundary, not the bind
      # address (I-12). Both values are already permitted.
      host: 0.0.0.0
      port: 8000
    paths:
      data: /var/lib/cairn
      # I-92's adapter-credential directory, and the mount point of the
      # Secret below. With graphiti disabled nothing reads it.
      credentials: /var/run/secrets/cairn
    attic:
      enabled: true
    graphiti:
      # On, and pointed at the component's Service inside this instance's
      # own namespace — a short name, because the namespace is the
      # isolation boundary and a configuration naming another namespace's
      # index has already lost the argument. The credentials it needs are
      # files under paths.credentials (I-92), never keys in this
      # document.
      enabled: true
      host: falkordb
      port: 6379
    delivery:
      interval_seconds: 5

# A Deployment and not a StatefulSet: the gateway holds no state, has no
# claim and no identity worth being stable. One replica, because I-93
# says one per cluster and a second would double the surface without
# removing the single point of failure that matters — an instance whose
# gateway is down cannot reach a provider either way, and Cairn's own
# operation does not depend on it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cairn-egress-gateway
  namespace: cairn-egress
  labels:
    app.kubernetes.io/name: cairn-egress-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cairn-egress-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cairn-egress-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Retain the accepted gateway UID/GID and writable-volume policy.
        # v0.5 tests the Squid7 binary directly under UID13; the image's
        # Pebble launcher/default user are not part of this workload.
        runAsUser: 13
        runAsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: ubuntu/squid:7.2-26.04_edge@sha256:44eee73a21554c4732d6a5daee675f3a33395f36017d7bf7cc8ccb455b1f9665
          # The Canonical rock defaults to Pebble. Run the reviewed Squid
          # binary directly with the existing foreground/config flags.
          command: ["/usr/sbin/squid-gnutls"]
          args:
            - -f
            - /etc/squid/squid.conf
            - -NYC
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Mount the reviewed configuration at the explicit -f path.
            # A subPath mount does not track ConfigMap updates; a change
            # here is a redeploy, which is what changing an allow-list
            # should be.
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: egress-gateway-config

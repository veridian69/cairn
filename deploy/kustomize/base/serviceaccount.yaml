# I-11: a ServiceAccount with no API permissions, and no token mounted
# into the Pod. Cairn never talks to the Kubernetes API; the account
# exists so the Pod does not silently run as the namespace default, which
# is the one account an operator is most likely to have granted something.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cairn
  labels:
    app.kubernetes.io/name: cairn
    app.kubernetes.io/instance: cairn
automountServiceAccountToken: false
